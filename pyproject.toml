[project]
license = "MIT"
name = "llm-test-generation"
version = "0.1.0"
description = "Fine-tune a small model to write unit tests that expose bugs, measured by mutation score against prompting baselines."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testgen"]

[tool.uv]
package = true
# mlx-lm needs transformers>=5; the jina code-embedding model's remote code
# needs transformers<5. They cannot share a venv, so they are conflicting
# groups: `make sync-models` for generation/training, `make sync-decontam`
# for the one-off decontamination pass.
conflicts = [[{ group = "models" }, { group = "decontam" }]]

[dependency-groups]
# Generation (T6+) and training: mlx-lm pulls transformers 5.
models = [
    "mlx-lm>=0.31.1",
    "mlx-lm-lora>=3.1.2",
]
# Layer-2 decontamination only; heavy (torch). Conflicts with `models`.
decontam = [
    "sentence-transformers>=3.0,<5",
    "transformers>=4.45,<5",  # jina-v2-code remote code breaks on transformers 5
    "torch>=2.4",
    "einops>=0.8",
]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "rich>=15.0.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes; I: import order; B: bugbear; UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
