[project]
name = "llm-test-generation"
version = "0.1.0"
description = "Fine-tune a small model to write unit tests that expose bugs, measured by mutation score against prompting baselines."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testgen"]

[tool.uv]
package = true

[dependency-groups]
# Layer-2 decontamination only; heavy (torch). `uv sync --group decontam`.
decontam = [
    "sentence-transformers>=3.0,<5",
    "transformers>=4.45,<5",  # jina-v2-code remote code breaks on transformers 5
    "torch>=2.4",
    "einops>=0.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes; I: import order; B: bugbear; UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
